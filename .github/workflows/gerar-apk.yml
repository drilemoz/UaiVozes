name: Gerar APK Eleven
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar_release:
        description: 'Publicar o APK numa Release (opcional)'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  android:
    name: Testar e compilar APK ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar Android nativo e configurar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/prepare_android.sh
      - name: Instalar dependências
        run: flutter pub get
      - name: Verificar sintaxe e análise
        run: flutter analyze
      - name: Testar modelos
        run: flutter test
      - name: Compilar APK ARM64 otimizado
        run: flutter build apk --release --target-platform android-arm64
      - name: Exportar APK fora do ZIP
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Eleven-v0.01.apk
          test -s dist/Eleven-v0.01.apk
      - name: APK para download (GitHub Manager / Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Eleven-v0.01-apk
          path: dist/Eleven-v0.01.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar Release opcional
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publicar_release == true)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.1
          name: Eleven v0.01 (alpha.1)
          prerelease: true
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: dist/Eleven-v0.01.apk
